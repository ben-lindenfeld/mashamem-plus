const V2_CAT_ICONS={play:'game',build:'laptop',create:'film',outside:'tree',move:'bolt',learn:'book',hands:'palette',explore:'flask',quests:'compass'};
function cicon(c){return ic(V2_CAT_ICONS[c.id]||'bulb',30)}
const C=window.CATEGORIES,ALL=C.flatMap(c=>c.ideas.map(i=>({...i,cat:c.id}))),KEY='mashamem-plus-v1';
const defaults={saved:[],history:[],xp:0,theme:'dark',count:1,enabled:C.map(c=>c.id),visits:{},habits:[],habitLog:{},water:{d:'',n:0},events:[],eventDone:{},routine:null,routineLog:{},schoolTime:'07:45',challenges:{},chWeekly:null,questsMigrated:false};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'null')};if(!Array.isArray(state.saved)||!Array.isArray(state.history)||!Array.isArray(state.enabled))throw Error();}catch(e){state=structuredClone(defaults);}
let current=[],currentCat=null,historyFilter='all',toastTimer;const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const n=v=>`<span class="num">${esc(v)}</span>`;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('השמירה לא זמינה. הנתונים יישארו רק עד סגירת הדף.')}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),2600)}
function day(d=new Date()){return [d.getFullYear(),d.getMonth()+1,d.getDate()].join('-')}
function streak(){const days=new Set(state.history.map(h=>day(new Date(h.at))));let d=new Date(),count=0;if(!days.has(day(d)))d.setDate(d.getDate()-1);while(days.has(day(d))){count++;d.setDate(d.getDate()-1)}return count}
function nav(){let route=location.hash.slice(1)||'home';if(route==='idea')route='home';const html=[['home','⌂','בית'],['saved','♡','שמורים'],['history','✓','עשיתי'],['settings','⚙','הגדרות']].map(([id,icon,title])=>`<a class="navbutton ${route===id?'active':''}" href="#${id}" ${route===id?'aria-current="page"':''}><span class="nav-icon">${icon}</span>${title}</a>`).join('');for(const id of ['topnav','bottomnav'])document.getElementById(id).innerHTML=html;document.body.classList.toggle('light',state.theme==='light');document.querySelector('.theme').textContent=state.theme==='dark'?'☀':'☾';document.querySelector('meta[name=theme-color]').content=state.theme==='dark'?'#111221':'#f5f4fc'}

function home(){const top=Object.entries(state.visits).sort((a,b)=>b[1]-a[1])[0];app.innerHTML=`<section class="hero"><div><div class="eyebrow"><span class="spark"></span>משהו טוב מתחיל ברגע של שעמום</div><h1>😐 משעמם לי.<br><em>מה בא לי לעשות?</em></h1><p class="intro">לא צריך לחשוב. פשוט תבחר קטגוריה.</p>${stats()}</div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit orbit2"></div><div class="face"><span>···</span></div><div class="float f1">${ic('game',26)}</div><div class="float f2">${ic('palette',26)}</div><div class="float f3">${ic('bulb',26)}</div><div class="float f4">✦</div></div></section><div class="section-head"><h2>איזה מצב רוח יש לך?</h2><span class="small">בוחרים. מנסים. נהנים.</span></div><div class="grid">${enabled().map(c=>`<button class="category" style="--cat:${c.color}" data-cat="${c.id}">${top&&top[0]===c.id&&top[1]>=3?'<span class="recommend">אולי יתאים לך</span>':''}<span class="cat-arrow">↖</span><span class="cat-icon">${cicon(c)}</span><h3>${c.name}</h3><p>${c.sub}</p></button>`).join('')}</div><section class="random"><div><h2>לא יודע מה בא לי?</h2><p>לפעמים הכי כיף לתת למזל לבחור.</p></div><button class="primary" data-action="random">🎲 תבחר לי משהו</button></section><p class="note">בלי משימות חובה. בלי ציונים. רק עוד דרך ליהנות מהזמן שלך.</p>`}
function choose(cat=null,exclude=[]){const pool=ALL.filter(i=>state.enabled.includes(i.cat)&&(!cat||i.cat===cat)&&!exclude.includes(i.id));if(!pool.length)return null;const max=Math.max(1,...Object.values(state.visits)),weights=pool.map(i=>1+Math.min(.35,(state.visits[i.cat]||0)/max*.35));let r=Math.random()*weights.reduce((a,b)=>a+b,0),ix=0;while(ix<weights.length-1&&(r-=weights[ix])>=0)ix++;return pool[ix]}
function draw(cat=currentCat){currentCat=cat;const old=current.map(i=>i.id);current=[];for(let i=0;i<state.count;i++){const picked=choose(cat,[...old,...current.map(x=>x.id)]);if(picked)current.push(picked)}if(!current.length){toast('צריך להפעיל קטגוריה בהגדרות');location.hash='settings';return}for(const item of current)state.visits[item.cat]=(state.visits[item.cat]||0)+1;persist();if(location.hash==='#idea')render();else location.hash='idea'}

function ideaCard(i){const c=catOf(i),saved=state.saved.includes(i.id),done=state.history.some(h=>h.id===i.id&&day(new Date(h.at))===day());return `<article class="idea-card" style="--cat:${c.color}"><div class="idea-category">${cicon(c)} ${c.name}</div><p class="idea-label">🎯 הרעיון שלך</p><h2 class="idea-text">${esc(i.text)}</h2><div class="meta"><span>⏱ ${n(i.time)} דקות <small>(הערכה)</small></span><span><i class="energy-dot" style="background:${i.energy==='נמוכה'?'#77d7a2':i.energy==='בינונית'?'#ffc56b':'#ff888b'}"></i>אנרגיה ${i.energy}</span></div>${['move','outside','hands'].includes(c.id)?'<p class="small" style="margin-top:15px">בקצב שלך, במקום בטוח ועם ציוד מתאים. אפשר להתאים או לעצור בכל רגע.</p>':''}<div class="actions"><button class="primary" data-done="${i.id}" ${done?'disabled':''}>${done?'✓ כבר עשית היום':'✅ עשיתי את זה!'}</button><button class="secondary ${saved?'saved-on':''}" data-save="${i.id}" aria-pressed="${saved}">${saved?'♥ שמור':'♡ שמור'}</button><button class="secondary" data-action="another">🔄 רעיון אחר</button></div></article>`}
function ideas(){if(!current.length){draw(null);return}app.innerHTML=`<div class="idea-wrap"><a class="back" href="#home">→ חזרה לקטגוריות</a><div class="idea-heading"><div class="eyebrow" style="justify-content:center">רגע אחד של השראה</div><h1>בוא ננסה משהו.</h1><p class="small">זה רק רעיון. אפשר לקחת אותו לכיוון שלך.</p></div>${current.map(ideaCard).join('')}<p class="note">גם פעילות קטנה היא התחלה טובה ✦</p></div>`}
function listCard(i,at=null){const c=catOf(i);return `<article class="list-card"><div class="idea-category" style="--cat:${c.color}">${cicon(c)} ${c.name}</div><h3>${esc(i.text)}</h3><div class="small">${at?esc(new Date(at).toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'}))+' · '+n('+10')+' XP':'⏱ '+n(i.time)+' דקות · אנרגיה '+i.energy}</div><div class="actions"><button class="secondary" data-open="${i.id}">פתח רעיון ↖</button>${at?`<button class="secondary" data-undo="${at}">ביטול השלמה</button>`:`<button class="secondary saved-on" data-save="${i.id}">♥ הסר משמורים</button>`}</div></article>`}
const empty=(icon,title,text)=>`<div class="empty"><div class="empty-icon">${icon}</div><h2>${title}</h2><p>${text}</p><a class="primary" href="#home">למצוא רעיון חדש</a></div>`;
function saved(){const items=state.saved.map(id=>ALL.find(i=>i.id===id)).filter(Boolean);app.innerHTML=`<h1>${ic('heart',26)} רעיונות ששווה לחזור אליהם</h1><p class="intro">הדברים שתפסו לך את העין. ${n(items.length)} שמורים.</p><div style="height:26px"></div>${items.length?`<div class="list-grid">${items.map(i=>listCard(i)).join('')}</div>`:empty('♡','כאן יישמרו הרעיונות שלך','מצא משהו שאהבת ולחץ על "שמור".')}`}
function history(){const used=[...new Set(state.history.map(h=>ALL.find(i=>i.id===h.id)?.cat).filter(Boolean))],items=state.history.filter(h=>historyFilter==='all'||ALL.find(i=>i.id===h.id)?.cat===historyFilter);app.innerHTML=`<h1>${ic('spark',26)} כל הדברים שכבר ניסית</h1><p class="intro">לא רשימת מטלות. אוסף של רגעים.</p><div class="history-stats"><div class="metric"><b>${n(state.history.length)}</b><span>פעילויות שהושלמו</span></div><div class="metric"><b>${n(state.xp)}</b><span>XP שצברת</span></div><div class="metric"><b>${n(streak())}</b><span>ימים ברצף</span></div></div>${state.history.length?`<h2>הפעילויות האחרונות</h2><div class="filters"><button class="filter ${historyFilter==='all'?'active':''}" data-filter="all">הכול</button>${used.map(id=>{const c=C.find(x=>x.id===id);return `<button class="filter ${historyFilter===id?'active':''}" data-filter="${id}">${cicon(c)} ${c.name}</button>`}).join('')}</div><div class="list-grid">${items.slice().reverse().map(h=>{const i=ALL.find(i=>i.id===h.id);return i?listCard(i,h.at):''}).join('')}</div>`:empty('✦','ההרפתקה הבאה עוד לפניך','עשית משהו? סמן "עשיתי את זה!" והוא יופיע כאן.')}`}
function settings(){app.innerHTML=`<section class="settings"><h1>${ic('gear',26)} בדיוק בקצב שלך</h1><p class="intro">קצת התאמות, וזהו. בלי התעסקות.</p><div class="setting-box"><h2>המראה והרעיונות</h2><div class="setting-row"><div><label>מצב בהיר</label><p>ברירת המחדל היא מצב כהה</p></div><button class="switch ${state.theme==='light'?'on':''}" role="switch" aria-checked="${state.theme==='light'}" aria-label="מצב בהיר" data-action="theme"><span></span></button></div><div class="setting-row"><div><label for="idea-count">כמה רעיונות להציג?</label><p>רעיון אחד, או כמה אפשרויות לבחירה</p></div><select id="idea-count">${[1,2,3,5].map(v=>`<option value="${v}" ${v===state.count?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="setting-box"><h2>הקטגוריות שלך</h2><p class="small">הפעל מה שמעניין אותך. תמיד נשאיר לפחות קטגוריה אחת.</p>${C.map(c=>`<div class="setting-row"><label>${cicon(c)} ${c.name}</label><button class="switch ${state.enabled.includes(c.id)?'on':''}" role="switch" aria-checked="${state.enabled.includes(c.id)}" aria-label="${c.name}" data-toggle="${c.id}"><span></span></button></div>`).join('')}</div><div class="setting-box"><h2>הנתונים שלך</h2><p class="small">הכול נשמר רק בדפדפן הזה. אין סנכרון בין מכשירים ואין שרת. גלישה פרטית או ניקוי נתוני אתר עלולים למחוק את הנתונים.</p><div class="setting-row"><div><label>איפוס היסטוריה</label><p>מוחק פעילויות ורצף, לא XP</p></div><button class="secondary danger" data-action="reset-history">איפוס</button></div><div class="setting-row"><div><label>איפוס XP</label><p>ההיסטוריה והשמורים נשארים</p></div><button class="secondary danger" data-action="reset-xp">איפוס</button></div><div class="setting-row"><div><label>הורדת גיבוי</label><p>אפשר לייבא גם בדפדפן אחר</p></div><button class="secondary" data-action="export">הורדה</button></div><div class="setting-row"><label for="import-file">ייבוא גיבוי</label><input type="file" id="import-file" accept="application/json" style="max-width:155px;font-size:12px"></div></div><div class="setting-box"><details class="install-help"><summary>איך פותחים את האתר עם הדפדפן? ↙</summary><ol><li><b>Chrome במחשב:</b> הגדרות ← בעת ההפעלה ← פתיחת דף מסוים או קבוצת דפים ← הוסף דף חדש. הדבק את כתובת האתר.</li><li><b>Edge:</b> הגדרות ← התחלה, בית וכרטיסיות חדשות ← כאשר Edge מופעל ← פתח דפים אלה ← הוסף כתובת.</li><li><b>Safari במחשב:</b> Safari ← הגדרות ← כללי ← דף הבית. הדבק את הכתובת ובחר שחלונות חדשים ייפתחו בדף הבית.</li><li><b>iPhone:</b> ב-Safari לחץ שיתוף ← הוסף למסך הבית. זו דרך לפתוח בלחיצה אחת; אתר לא יכול לפתוח את עצמו בכל פתיחת Safari באייפון.</li></ol></details></div><div class="setting-box"><details class="install-help"><summary>הקוד והוראות הרצה ↙</summary><p>אתר סטטי, ללא התקנות או תלויות. כל הקוד בקובץ ההורדה, יחד עם הוראות הרצה ופריסה.</p><a class="secondary" href="https://github.com/ben-lindenfeld/mashamem-plus" download>הורדת כל הפרויקט ↓</a><p>מבנה: index.html · style.css · data.js · app.js · icon.svg · README.md</p><p>להרצה מקומית: ${n('python3 -m http.server 8000')} מתוך תיקיית הפרויקט, ואז פתח ${n('http://localhost:8000')}.</p></details></div><p class="note">המערכת לומדת מקומית מה מעניין אותך, עם עדיפות קלה בלבד.<br>אין חשבון, פרסומות או התראות.</p></section>`}
function render(){nav();const route=location.hash.slice(1)||'home';({home,saved,history,settings,idea:ideas}[route]||home)()}
function celebrate(){const root=document.getElementById('confetti');root.innerHTML=Array.from({length:30},(_,i)=>`<i class="confetti" style="left:${Math.random()*100}%;background:${['#baa3ff','#ff9ec6','#77d7a2','#ffc56b'][i%4]};animation-delay:${Math.random()*.25}s"></i>`).join('');setTimeout(()=>root.innerHTML='',2300)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.cat){draw(d.cat);return}if(d.save){if(state.saved.includes(d.save)){state.saved=state.saved.filter(id=>id!==d.save);toast('הוסר מהשמורים')}else{state.saved.push(d.save);toast('♥ נשמר לרגע של שעמום')}persist();render();return}if(d.done){if(state.history.some(h=>h.id===d.done&&day(new Date(h.at))===day()))return;state.history.push({id:d.done,at:new Date().toISOString(),xp:10});state.xp+=10;persist();render();toast('כל הכבוד! עוד 10 XP ✦');celebrate();return}if(d.open){current=[ALL.find(i=>i.id===d.open)];currentCat=current[0].cat;location.hash='idea';return}if(d.undo){state.history=state.history.filter(h=>h.at!==d.undo);state.xp=Math.max(0,state.xp-10);persist();render();toast('ההשלמה בוטלה');return}if(d.filter){historyFilter=d.filter;render();return}if(d.toggle){if(state.enabled.includes(d.toggle)){if(state.enabled.length===1){toast('צריך להשאיר לפחות קטגוריה אחת');return}state.enabled=state.enabled.filter(id=>id!==d.toggle)}else state.enabled.push(d.toggle);persist();render();return}switch(d.action){case'random':draw(null);break;case'another':draw();break;case'theme':state.theme=state.theme==='dark'?'light':'dark';persist();render();break;case'reset-history':if(confirm('למחוק את כל ההיסטוריה והרצף? השמורים וה-XP יישארו.')){state.history=[];historyFilter='all';persist();render();toast('ההיסטוריה אופסה')}break;case'reset-xp':if(confirm('לאפס את הניקוד? ההיסטוריה והשמורים יישארו.')){state.xp=0;persist();render();toast('ה-XP אופס')}break;case'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bored-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}});
document.addEventListener('change',async e=>{if(e.target.id==='idea-count'){state.count=Number(e.target.value);persist();toast('מספר הרעיונות עודכן')}if(e.target.id==='import-file'){try{const s=JSON.parse(await e.target.files[0].text()),ids=new Set(ALL.map(i=>i.id));if(!Array.isArray(s.saved)||!Array.isArray(s.history)||!Array.isArray(s.enabled)||!['dark','light'].includes(s.theme)||![1,2,3,5].includes(s.count)||!Number.isFinite(s.xp)||s.xp<0)throw Error();if(!s.enabled.length||s.enabled.some(id=>!C.some(c=>c.id===id))||s.saved.some(id=>!ids.has(id))||s.history.some(h=>!ids.has(h.id)||isNaN(Date.parse(h.at))))throw Error();if(confirm('להחליף את הנתונים המקומיים בגיבוי הזה?')){state={...defaults,...s};persist();render();toast('הגיבוי יובא בהצלחה')}}catch(err){toast('הקובץ לא נראה כמו גיבוי תקין')}}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script>

<script>
// ===== V2: עוזר אישי ליום =====
const V2_LEVELS=['מתחיל','מתאמן','עקבי','ממוקד','חזק','מקצוען','אלוף','מאסטר','אגדה','בלתי מנוצח'];
function v2level(){return Math.min(10,Math.floor(state.xp/100)+1)}
function v2today(){return day()}
const today=v2today()
function v2dateParse(s3){const p3=s3.split('-').map(Number);return new Date(p3[0],p3[1]-1,p3[2])}
function v2dateHeb(s3){return v2dateParse(s3).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}
function v2dateISO(s3){const p3=s3.split('-');return p3[0]+'-'+String(p3[1]).padStart(2,'0')+'-'+String(p3[2]).padStart(2,'0')}
let v2mig=false;
state.events.forEach(e=>{if(!e.date){e.date=today;v2mig=true}if(e.done===undefined){e.done=(state.eventDone[today]||[]).includes(e.id);v2mig=true}});
if(!state.calCursor){state.calCursor=today;v2mig=true}
if(v2mig)persist()
function v2parse(t){const p=t.split(':');return Number(p[0])*60+Number(p[1])}
function v2fmt(min){min=((min%1440)+1440)%1440;return Math.floor(min/60)+':'+String(min%60).padStart(2,'0')}
function v2addXp(x,msg){state.xp+=x;persist();if(msg)toast(msg);celebrate()}
const V2_ROUTINE_DEFAULT=[
 {id:'r1',t:'כוס מים ראשונה',m:1},
 {id:'r2',t:'תנועה קלה - קפיצות, שכיבות סמיכה או מתיחות',m:5},
 {id:'r3',t:'אור שמש - כמה דקות בחוץ או ליד החלון',m:5},
 {id:'r4',t:'ארוחת בוקר עם חלבון',m:10},
 {id:'r5',t:'המשימה הקשה של היום - קודם',m:15},
 {id:'r6',t:'רק עכשיו מותר טלפון',m:0}];
function v2routine(){if(!state.routine||!state.routine.length)state.routine=V2_ROUTINE_DEFAULT.slice();return state.routine}
function v2routineDone(){const d=v2today();if(!state.routineLog[d])state.routineLog[d]=[];return state.routineLog[d]}
const V2_DAILY=['טיול של 20 דקות בלי טלפון','3 שיחות עם אנשים חדשים','לסדר את החדר 15 דקות','שעה של עבודה עמוקה בלי הסחות','מחמאה ספציפית למישהו','ללמוד משהו חדש 30 דקות','ארוחה בלי מסך','לכתוב עמוד ביומן','אימון קצר של 15 דקות','לעשות משהו שאף אחד לא יראה'];
const V2_WEEKLY=[{id:'w1',t:'20 עמודים קריאה ביום'},{id:'w2',t:'יומן כתיבה כל ערב'},{id:'w3',t:'לכתוב 3 דברים טובים מהיום'},{id:'w4',t:'שעה בלי מסך לפני השינה'},{id:'w5',t:'בלי טלפון בשעה הראשונה של היום'},{id:'w6',t:'10 דקות של תנועה שכיף לך'}];
const V2_AI=[
 {q:'מתי ללכת לישון?',a:'תלוי מתי אתה צריך לקום. בני נוער צריכים 8-10 שעות שינה (המלצת האקדמיה האמריקאית לרפואת שינה). כנס למסך השינה, תזין שעת קימה, ותקבל שעת שינה מומלצת.'},
 {q:'מתי לקום?',a:'שעת קימה קבועה ברוב הימים עוזרת לשעון הביולוגי ונותנת יותר אנרגיה בבוקר - אבל הכי חשוב לישון מספיק שעות (8-10 בגיל שלך), אז אם נרדמת מאוחר, עדיף להשלים שינה.'},
 {q:'כמה מים לשתות?',a:'כלל אצבע פשוט: כוס מים ראשונה מיד כשקמים, ואז כוס בכל ארוחה ובין ארוחות. מסך המים יעזור לך לעקוב.'},
 {q:'מה חשוב לאכול בבוקר?',a:'ארוחת בוקר עם חלבון (ביצים, יוגורט יווני) נותנת אנרגיה יציבה יותר מדברים מתוקים, שגורמים לנפילה באמצע הבוקר.'},
 {q:'איך להפסיק לגלול בטלפון?',a:'לא להילחם בטלפון - להפוך את החיים למעניינים יותר. טיפים: מסך אפור, אפליקציות מסיחות בתיקייה רחוקה, וכשמשעמם - לבחור רעיון מהאפליקציה במקום לגלול.'},
 {q:'איך להתחיל את הבוקר נכון?',a:'מים, תנועה קלה, אור שמש, ארוחת בוקר - ואז המשימה הקשה קודם. כל השגרה שלך במסך הבוקר.'}];
function v2hub(){const tot=C.reduce((a,c)=>a+c.ideas.length,0);return `<div class="hub">
<a href="#morning">${ic('sun',26)}בוקר<small>השגרה שלך להתחלת יום</small></a>
<a href="#calendar">${ic('cal',26)}יומן<small>הימים שלך, איך שאתה מגדיר</small></a>
<a href="#ideas">${ic('bulb',26)}רעיונות<small>${n(tot)} דברים לעשות כשמשעמם</small></a>
<a href="#challenges">${ic('target',26)}אתגרים<small>אתגר יומי וניסוי שבועי</small></a>
<a href="#sleep">${ic('moon',26)}שינה<small>מתי ללכת לישון</small></a>
<a href="#water">${ic('drop',26)}מים<small>מעקב שתייה יומי</small></a>
<a href="#habits">${ic('check',26)}הרגלים<small>הרגלים קבועים, בלי לחץ</small></a>
<a href="#levels">${ic('trophy',26)}רמות<small>ה-XP שלך הופך לדרגות</small></a>
<a href="#ai">${ic('robot',26)}עוזר חכם<small>תשובות לשאלות נפוצות</small></a>
</div>`}
function v2home(){const lv=v2level(),into=state.xp%100;const chId=(v2today().replace(/\D/g,'')|0)%V2_DAILY.length;
app.innerHTML=`<section class="hero"><div><div class="eyebrow"><span class="spark"></span>העוזר האישי שלך ליום</div><h1>שלום בן.<br><em>מה נעשה היום?</em></h1>${stats()}</div></section>
<div class="v2card"><div class="v2row"><b>רמה ${n(lv)} · ${V2_LEVELS[lv-1]}</b><span class="v2muted"><bdi dir="ltr">${n(into)}/100</bdi> XP לרמה הבאה</span></div><div class="v2bar"><i style="width:${into}%"></i></div></div>
${v2hub()}
<div class="v2card"><b>${ic('target',18)} האתגר של היום</b><p>${esc(V2_DAILY[chId])}</p>${state.challenges[v2today()]?'<span class="pill">✓ בוצע!</span>':`<button class="primary" data-v2="ch-done" data-id="${chId}">עשיתי! +25 XP</button>`}</div>`}
function v2morning(){const r=v2routine(),done=v2routineDone(),tot=r.reduce((a,x)=>a+x.m,0),wake=v2parse(state.schoolTime)-tot;
app.innerHTML=`<section><h1>${ic('sun',26)} שגרת הבוקר</h1><p class="intro">נבנית אחורה מהשעה שאתה צריך להיות בבית הספר. כל צעד אפשר לערוך - זו השראה, לא חוקים.</p>
<div class="v2card"><div class="v2row"><label for="v2-school"><b>שעת הגעה לבית הספר</b></label><span><input class="v2in" type="time" id="v2-school" value="${state.schoolTime}"> <button class="secondary" data-v2="school-save">שמור</button></span></div>
<p class="v2muted">סה״כ השגרה: ${n(tot)} דקות ← קימה מומלצת ב-${v2fmt(wake)}. לישון ב-${v2fmt(wake-9*60)} בערך (9 שעות שינה).</p></div>
<div class="v2card">${r.map(x=>`<div class="v2row"><span class="${done.includes(x.id)?'v2done':''}">${esc(x.t)} <span class="v2muted">${x.m?n(x.m)+' דק׳':''}</span></span><span><button class="${done.includes(x.id)?'secondary':'primary'}" data-v2="routine-toggle" data-id="${x.id}">${done.includes(x.id)?'בטל':'✓'}</button> <button class="secondary" data-v2="routine-del" data-id="${x.id}" title="מחק">${ic('trash',15)}</button></span></div>`).join('')}</div>
<div class="v2card"><b>צעד חדש</b><div class="v2row"><input class="v2in" id="v2-rt" placeholder="מה עושים?" style="flex:1"><input class="v2in" id="v2-rm" type="number" min="0" max="120" placeholder="דק׳" style="width:70px"><button class="primary" data-v2="routine-add">הוסף</button></div></div>
<p class="v2muted">השראה לשגרה: ששת הרגלי הבוקר של Pierre Dalati. כל צעד שמסמנים נותן 5 XP. השגרה מתאפסת כל בוקר.</p></section>`}
function v2sleep(){app.innerHTML=`<section><h1>${ic('moon',26)} שינה</h1><p class="intro">בני נוער צריכים 8-10 שעות שינה (האקדמיה האמריקאית לרפואת שינה). תזין מתי אתה צריך לקום:</p>
<div class="v2card"><div class="v2row"><label for="v2-wake"><b>שעת קימה</b></label><span><input class="v2in" type="time" id="v2-wake" value="${v2fmt(v2parse(state.schoolTime)-45)}"> <button class="primary" data-v2="sleep-calc">חשב</button></span></div><div id="v2-sleep-out"></div></div>
<div class="v2card"><b>טיפים לשינה טובה יותר</b><p class="v2muted">ארוחה אחרונה 2-3 שעות לפני השינה · חדר חשוך (וילונות האפלה) · חדר קריר, בערך 19-21 מעלות · ספר במקום מסך לפני השינה · לקום ולישון באותן שעות כל יום, גם בסופ״ש · אור שמש מיד אחרי הקימה</p></div></section>`}
function v2water(){const w=(state.water.d!==v2today())?(state.water={d:v2today(),n:0}):state.water;const goal=8;
app.innerHTML=`<section><h1>${ic('drop',26)} מים</h1><p class="intro">כוס ראשונה מיד כשקמים, ואז כוס בכל ארוחה וביניהן.</p>
<div class="v2card" style="text-align:center"><div style="font-size:44px;font-weight:800">${n(w.n)}<span class="v2muted">/${n(goal)}</span></div><div class="v2bar"><i style="width:${Math.min(100,w.n/goal*100)}%"></i></div><div style="color:#7fd0ff">${w.n?Array(Math.min(w.n,12)).fill(ic('drop',18)).join(''):'<span class="v2muted">עוד לא שתית היום</span>'}</div><button class="primary" data-v2="water-add">שתיתי כוס! +2 XP</button></div>
<p class="v2muted">המונה מתאפס כל בוקר.</p></section>`}
function v2habitStreak(id){let s=0;const d=new Date();for(let i=0;i<400;i++){const k=day(d);const arr=state.habitLog[k]||[];if(arr.includes(id))s++;else if(i>0)break;else if(i===0&&!arr.includes(id)){/* today not done yet, keep counting from yesterday */}d.setDate(d.getDate()-1)}return s}
function v2habits(){const d=v2today(),done=state.habitLog[d]||[];
app.innerHTML=`<section><h1>${ic('check',26)} הרגלים</h1><p class="intro">הרגל חדש לוקח זמן - במחקר UCL אחד זה נע בין 18 ל-254 ימים, תלוי בהרגל ובאדם. פספוס לא מוחק את ההתקדמות, פשוט ממשיכים.</p>
<div class="v2card"><div class="v2row"><input class="v2in" id="v2-habit" placeholder="הרגל חדש, למשל: לקרוא 20 עמודים" style="flex:1"><button class="primary" data-v2="habit-add">הוסף</button></div></div>
<div class="v2card">${state.habits.length?state.habits.map(h=>`<div class="v2row"><span class="${done.includes(h.id)?'v2done':''}">${esc(h.t)}<br><span class="v2muted">✔ ${n(v2habitStreak(h.id))} ימים ברצף - וגם פספוס זה חלק מהדרך</span></span><span><button class="${done.includes(h.id)?'secondary':'primary'}" data-v2="habit-toggle" data-id="${h.id}">${done.includes(h.id)?'בטל':'✓ היום'}</button> <button class="secondary" data-v2="habit-del" data-id="${h.id}" title="מחק">${ic('trash',15)}</button></span></div>`).join(''):'<p class="v2muted">עוד אין הרגלים. תוסיף את הראשון!</p>'}</div>
<p class="v2muted">סימון הרגל נותן 10 XP, פעם ביום.</p></section>`}
function v2calendar(){const cur=state.calCursor||today,evs=state.events.filter(e=>e.date===cur).sort((a,b)=>a.time.localeCompare(b.time)),ed=state.editingEvent?state.events.find(e=>e.id===state.editingEvent):null;
app.innerHTML=`<section><h1>${ic('cal',26)} היומן שלי</h1><p class="intro">היומן שלך, איך שאתה מגדיר אותו. מנווטים בין ימים, מוסיפים, עורכים, מסמנים, מוחקים.</p>
<div class="v2card"><div style="text-align:center"><b>${v2dateHeb(cur)}</b></div><div class="v2row" style="justify-content:center;flex-wrap:nowrap"><button class="secondary" data-v2="cal-prev">‹ יום קודם</button><button class="secondary" data-v2="cal-next">יום הבא ›</button></div>
<div class="v2row"><input class="v2in" type="date" id="v2-goto" value="${v2dateISO(cur)}" style="flex:1"><button class="secondary" data-v2="cal-goto">עבור</button>${cur!==today?'<button class="secondary" data-v2="cal-today">להיום</button>':''}</div></div>
<div class="v2card"><b>${ed?'עריכת אירוע':'אירוע חדש · '+v2dateHeb(cur)}</b><div class="v2row"><input class="v2in" type="time" id="v2-et" style="width:100px" value="${ed?ed.time:''}"><input class="v2in" id="v2-ett" placeholder="מה קורה?" style="flex:1" value="${ed?esc(ed.title):''}"><button class="primary" data-v2="event-save">${ed?'שמור':'הוסף'}</button>${ed?'<button class="secondary" data-v2="event-cancel">ביטול</button>':''}</div></div>
<div class="v2card">${evs.length?evs.map(e=>`<div class="v2row"><span class="${e.done?'v2done':''}"><b>${e.time}</b> · ${esc(e.title)}</span><span><button class="${e.done?'secondary':'primary'}" data-v2="event-toggle" data-id="${e.id}">${e.done?'בטל':'✓'}</button> <button class="secondary" data-v2="event-edit" data-id="${e.id}" title="ערוך">${ic('pencil',15)}</button> <button class="secondary" data-v2="event-del" data-id="${e.id}" title="מחק">${ic('trash',15)}</button></span></div>`).join(''):'<p class="v2muted">אין אירועים ביום הזה. תוסיף את הראשון!</p>'}</div>
<div class="v2card"><b>חלון פנוי?</b> <a href="#ideas" class="secondary" style="display:inline-block;padding:8px 14px;border-radius:12px;text-decoration:none">${ic('bulb',15)} קח רעיון מהמאגר</a></div></section>`}
function v2levels(){const lv=v2level(),into=state.xp%100;
app.innerHTML=`<section><h1>${ic('trophy',26)} רמות</h1><p class="intro">כל 100 XP עולים רמה. צוברים XP מפעילויות, הרגלים, שגרת בוקר ואתגרים.</p>
<div class="v2card"><div class="v2row"><b style="font-size:20px">רמה ${n(lv)} · ${V2_LEVELS[lv-1]}</b><span class="v2muted">${n(state.xp)} XP</span></div><div class="v2bar"><i style="width:${into}%"></i></div><p class="v2muted">${lv<10?'עוד '+n(100-into)+' XP לרמה '+(lv+1):'הגעת לרמה המקסימלית!'}</p></div>
<div class="v2card">${V2_LEVELS.map((t,i)=>`<div class="v2row"><span>${i+1<lv?ic('check',16):i+1===lv?'●':'○'} רמה ${n(i+1)}</span><b>${t}</b></div>`).join('')}</div></section>`}
function v2challenges(){const chId=(v2today().replace(/\D/g,'')|0)%V2_DAILY.length,done=state.challenges[v2today()];const w=state.chWeekly;
app.innerHTML=`<section><h1>${ic('target',26)} אתגרים</h1><p class="intro">אתגר קטן כל יום, ניסוי גדול כל שבוע. הכול הצעות - אתה בוחר מה מתאים לך.</p>
<div class="v2card"><b>האתגר היומי</b><p>${esc(V2_DAILY[chId])}</p>${done?'<span class="pill">✓ בוצע היום!</span>':`<button class="primary" data-v2="ch-done" data-id="${chId}">עשיתי! +25 XP</button>`}</div>
<div class="v2card"><b>ניסוי ה-7 ימים</b><p class="v2muted">בוחרים שינוי אחד ועושים אותו 7 ימים ברצף. הרעיון מ-Pierre Dalati. אלו רק רעיונות - אפשר גם להגדיר ניסוי משלך:</p>
${w?`<p><b>${esc(w.t)}</b> - יום ${n(w.checks.length)} מתוך 7</p><div class="v2bar"><i style="width:${w.checks.length/7*100}%"></i></div>${w.checks.includes(v2today())?'<span class="pill">✓ היום סומן</span>':`<button class="primary" data-v2="weekly-check">סיים את היום! +15 XP</button>`} ${w.checks.length>=7?'<p>🏆 ניסוי הושלם! אפשר להתחיל חדש.</p><button class="secondary" data-v2="weekly-reset">ניסוי חדש</button>':''}`
:V2_WEEKLY.map(x=>`<div class="v2row"><span>${esc(x.t)}</span><button class="primary" data-v2="weekly-join" data-id="${x.id}">מתחיל</button></div>`).join('')+`<div class="v2row"><input class="v2in" id="v2-wcustom" placeholder="ניסוי משלך: מה בא לך לנסות 7 ימים?" style="flex:1"><button class="primary" data-v2="weekly-custom">מתחיל</button></div>`}</div></section>`}
let v2engine=null,v2loading=false;
function v2ai(){app.innerHTML=`<section><h1>${ic('robot',26)} עוזר חכם</h1><p class="intro">תשובות קבועות לשאלות נפוצות - ולמטה, אופציה ל-AI אמיתי שרץ במכשיר שלך.</p>
<div class="v2card"><b>AI אמיתי (בטא)</b><p class="v2muted">בלי חשבון ובלי תשלום. הצ'אט עצמו מחושב על המכשיר שלך; בלחיצה למטה מורד מהאינטרנט מודל Qwen2.5-0.5B (כ-300MB, עדיף ב-wifi) ונשמר במכשיר - אם הדפדפן ינקה אחסון, תידרש הורדה חוזרת. דורש דפדפן חדש עם WebGPU - באייפון: iOS 26 ומעלה. שים לב: התכונה עדיין בבדיקות ולא הוכחה על מכשיר אמיתי - אם משהו לא יעבוד, תופיע הודעה ברורה והתשובות הקבועות נשארות.</p>
<div id="v2-ai-box">${v2engine?`<div id="v2-ai-log"></div><div class="v2row"><input class="v2in" id="v2-ai-q" placeholder="שאל שאלה..." style="flex:1"><button class="primary" data-v2="ai-send">שלח</button></div>`:'<button class="primary" data-v2="ai-beta">הפעל AI אמיתי</button>'}<div id="v2-ai-status" class="v2muted"></div></div></div>
${V2_AI.map((x,i)=>`<div class="v2card"><b>${esc(x.q)}</b><p class="v2muted">${esc(x.a)}</p></div>`).join('')}</section>`}
async function v2aiLoad(){if(v2loading||v2engine)return;v2loading=true;const st=document.getElementById('v2-ai-status');
try{
if(!navigator.gpu){st.textContent='הדפדפן הזה לא תומך ב-AI במכשיר (צריך WebGPU). התשובות הקבועות למטה עדיין כאן!';v2loading=false;return}
let model='Qwen2.5-0.5B-Instruct-q4f32_1-MLC';
try{const a=await navigator.gpu.requestAdapter();if(a&&a.features&&a.features.has('shader-f16'))model='Qwen2.5-0.5B-Instruct-q4f16_1-MLC'}catch(e){}
st.textContent='מוריד את מנוע ה-AI...';
const webllm=await import('https://esm.run/@mlc-ai/web-llm');
const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),12*60*1000));
v2engine=await Promise.race([webllm.CreateMLCEngine(model,{initProgressCallback:p2=>{if(st)st.textContent='מוריד מודל: '+Math.round(p2.progress*100)+'%'}}),timeout]);
render()}catch(err){v2engine=null;if(st)st.textContent='לא הצלחתי להפעיל AI במכשיר הזה כרגע. התשובות הקבועות למטה עדיין כאן!'}
v2loading=false}
let v2gen=false;
async function v2aiSend(){const inp=document.getElementById('v2-ai-q'),log=document.getElementById('v2-ai-log');if(!inp||!log||!v2engine||v2gen)return;const q=inp.value.trim();if(!q)return;inp.value='';v2gen=true;
log.innerHTML+=`<p><b>אתה:</b> ${esc(q)}</p><p class="v2muted"><b>AI:</b> <span id="v2-ai-cur"></span></p>`;const cur=document.getElementById('v2-ai-cur');
let cancelled=false;const to=setTimeout(async()=>{cancelled=true;try{await v2engine.interruptGenerate()}catch(e){}if(cur)cur.textContent='לקח יותר מדי זמן - נסה שאלה קצרה יותר, או תסגור ותפתח מחדש את ה-AI'},90000);
try{const stream=await v2engine.chat.completions.create({messages:[{role:'system',content:'You are a friendly, encouraging assistant for a 13-year-old boy. Answer briefly in simple Hebrew. General wellness only: never discuss diets, calories, weight or medical advice.'},{role:'user',content:q}],stream:true,max_tokens:256});
let full='';for await(const chunk of stream){if(cancelled)break;const t=chunk.choices[0]?.delta?.content||'';full+=t;if(cur)cur.textContent=full}}catch(err){if(cur&&!cancelled)cur.textContent='שגיאה - נסה שוב'}
clearTimeout(to);v2gen=false}
const v2oldHome=home;
const V2_ROUTES={home:v2home,ideas:v2oldHome,morning:v2morning,sleep:v2sleep,water:v2water,habits:v2habits,calendar:v2calendar,levels:v2levels,challenges:v2challenges,ai:v2ai};
render=function(){nav();const route=location.hash.slice(1)||'home';(V2_ROUTES[route]||({saved,history,settings,idea:ideas}[route]||v2home))()};
if(!state.questsMigrated){if(!state.enabled.includes('quests'))state.enabled.push('quests');state.questsMigrated=true;persist()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(!d.v2)return;const tk=v2today();
const acts={
 'school-save':()=>{const v=document.getElementById('v2-school').value;if(v){state.schoolTime=v;persist();toast('נשמר!');render()}},
 'routine-toggle':()=>{const done=v2routineDone();if(done.includes(d.id)){state.routineLog[today]=done.filter(x=>x!==d.id);persist()}else{done.push(d.id);v2addXp(5,'+5 XP')}render()},
 'routine-del':()=>{state.routine=v2routine().filter(x=>x.id!==d.id);persist();render()},
 'routine-add':()=>{const t=document.getElementById('v2-rt').value.trim(),m=Math.max(0,Math.min(120,Number(document.getElementById('v2-rm').value)||0));if(t){v2routine().push({id:'r'+Date.now(),t,m});persist();render()}},
 'sleep-calc':()=>{const v=document.getElementById('v2-wake').value;if(!v)return;const w=v2parse(v);document.getElementById('v2-sleep-out').innerHTML=`<p>לישון ב-<b>${v2fmt(w-9*60)}</b> (9 שעות) · בין <b>${v2fmt(w-10*60)}</b> ל-<b>${v2fmt(w-8*60)}</b> (8-10 שעות)</p>`},
 'water-add':()=>{const w=(state.water.d!==today)?(state.water={d:today,n:0}):state.water;w.n++;v2addXp(2,'+2 XP 💧');render()},
 'habit-add':()=>{const t=document.getElementById('v2-habit').value.trim();if(t){state.habits.push({id:'h'+Date.now(),t});persist();render()}},
 'habit-toggle':()=>{const arr=state.habitLog[today]||(state.habitLog[today]=[]);if(arr.includes(d.id)){state.habitLog[today]=arr.filter(x=>x!==d.id);persist()}else{arr.push(d.id);v2addXp(10,'+10 XP')}render()},
 'habit-del':()=>{state.habits=state.habits.filter(x=>x.id!==d.id);persist();render()},
 'cal-prev':()=>{const dd=v2dateParse(state.calCursor||today);dd.setDate(dd.getDate()-1);state.calCursor=day(dd);state.editingEvent=null;persist();render()},
 'cal-next':()=>{const dd=v2dateParse(state.calCursor||today);dd.setDate(dd.getDate()+1);state.calCursor=day(dd);state.editingEvent=null;persist();render()},
 'cal-today':()=>{state.calCursor=today;state.editingEvent=null;persist();render()},
 'cal-goto':()=>{const v=document.getElementById('v2-goto').value;if(v){state.calCursor=v.split('-').map(Number).join('-');state.editingEvent=null;persist();render()}},
 'event-save':()=>{const t=document.getElementById('v2-et').value,tt=document.getElementById('v2-ett').value.trim();if(t&&tt){if(state.editingEvent){const e=state.events.find(x=>x.id===state.editingEvent);if(e){e.time=t;e.title=tt}state.editingEvent=null}else{state.events.push({id:'e'+Date.now(),date:state.calCursor||today,time:t,title:tt,done:false})}persist();render()}else toast('צריך שעה וגם מה קורה')},
 'event-edit':()=>{state.editingEvent=d.id;render()},
 'event-cancel':()=>{state.editingEvent=null;render()},
 'event-toggle':()=>{const e=state.events.find(x=>x.id===d.id);if(e){e.done=!e.done;persist();render()}},
 'event-del':()=>{state.events=state.events.filter(x=>x.id!==d.id);if(state.editingEvent===d.id)state.editingEvent=null;persist();render()},
 'ai-beta':()=>{v2aiLoad()},
 'ai-send':()=>{v2aiSend()},
 'weekly-custom':()=>{const t=document.getElementById('v2-wcustom').value.trim();if(t){state.chWeekly={id:'wc'+Date.now(),t,checks:[]};persist();render()}},
 'ch-done':()=>{if(!state.challenges[tk]){state.challenges[tk]=d.id;v2addXp(25,'+25 XP 🎯')}render()},
 'weekly-join':()=>{const x=V2_WEEKLY.find(y=>y.id===d.id);state.chWeekly={id:x.id,t:x.t,checks:[]};persist();render()},
 'weekly-check':()=>{if(state.chWeekly&&!state.chWeekly.checks.includes(tk)){state.chWeekly.checks.push(tk);v2addXp(15,'+15 XP')}render()},
 'weekly-reset':()=>{state.chWeekly=null;persist();render()}
};const f=acts[d.v2];if(f)f()});
render();
</script>
</body></html>
